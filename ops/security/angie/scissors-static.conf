# Compatibility redirect only. Static and media files are served at
# studio.static.scissors.group; this legacy hostname does not serve files.
server {
    listen 80;
    server_name static.scissors-studio.online;
    return 301 https://studio.static.scissors.group$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name static.scissors-studio.online;
    ssl_certificate /etc/letsencrypt/live/scissors-studio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scissors-studio.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://studio.static.scissors.group$request_uri;
}

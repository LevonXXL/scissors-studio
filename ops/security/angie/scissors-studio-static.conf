server {
    listen 80;
    server_name studio.static.scissors.group;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://studio.static.scissors.group$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name studio.static.scissors.group;
    ssl_certificate /etc/letsencrypt/live/studio.scissors.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.scissors.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25M;

    access_log /var/log/angie/scissors-static-access.log;
    error_log /var/log/angie/scissors-static-error.log warn;

    location ^~ /thumbnail/ {
        root /home/scissors/media;
        disable_symlinks on;
        try_files $uri @scissors_thumbnail_django;
    }

    location @scissors_thumbnail_django {
        proxy_pass http://127.0.0.1:8553;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/scissors/static/;
        disable_symlinks on;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias /home/scissors/media/;
        disable_symlinks on;
        autoindex off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Serve legacy frontend publicAssetUrl paths from the public static tree.
    location / {
        root /home/scissors/static;
        try_files $uri =404;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(?:static|media)/(?:.*/)?\.[^/]+ {
        return 404;
    }

    location ~ ^/(?:.*/)?\.[^/]+ {
        return 404;
    }
}

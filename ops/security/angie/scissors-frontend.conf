map $upstream_http_content_security_policy $scissors_csp_with_static_host {
    default $upstream_http_content_security_policy;
    "~^(.+img-src[^;]*)(;.*)$" "$1 https://studio.static.scissors.group$2";
}

# Keep the apex domain on a temporary redirect while studio.scissors.group becomes canonical.
server {
    listen 80;
    server_name scissors.group www.scissors.group;
    location = /health/ { return 404; }
    location = /ready/  { return 404; }
    location / { return 302 https://studio.scissors.group$request_uri; }
}

server {
    listen 80;
    server_name studio.scissors.group;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location = /health/ { return 404; }
    location = /ready/  { return 404; }
    location / {
        return 301 https://studio.scissors.group$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name scissors.group www.scissors.group;
    ssl_certificate /etc/letsencrypt/live/scissors.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scissors.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /health/ { return 404; }
    location = /ready/  { return 404; }
    location / { return 302 https://studio.scissors.group$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name studio.scissors.group;
    ssl_certificate /etc/letsencrypt/live/studio.scissors.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.scissors.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/angie/scissors-frontend-access.log;
    error_log /var/log/angie/scissors-frontend-error.log warn;

    location = /health/ { return 404; }
    location = /ready/  { return 404; }

    location = /sitemap.xml {
        alias /home/scissors/static/sitemap.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        alias /home/scissors/static/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $scissors_csp_with_static_host always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

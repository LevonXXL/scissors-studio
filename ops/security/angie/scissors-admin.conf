upstream scissors_admin {
    server 127.0.0.1:8553;
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name admin.studio.scissors.group;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.studio.scissors.group;

    ssl_certificate /etc/letsencrypt/live/admin.studio.scissors.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.studio.scissors.group/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    access_log /var/log/angie/scissors-admin-access.log;
    error_log  /var/log/angie/scissors-admin-error.log warn;


    location ^~ /thumbnail/ {
        root /home/scissors/media;
        disable_symlinks on;
        try_files $uri @scissors_thumbnail_django;
    }

    location @scissors_thumbnail_django {
        proxy_pass http://127.0.0.1:8553;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Django
    location /static/ {
        alias /home/scissors/static/;
        disable_symlinks on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы
    location /media/ {
        alias /home/scissors/media/;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        expires 7d;
    }

    location ~ ^/(?:static|media)/(?:.*/)?\.[^/]+ {
        return 404;
    }

    # Проксирование на Django
    location / {
        proxy_pass http://scissors_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

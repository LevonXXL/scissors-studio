# Install as /etc/logrotate.d/scissors-analytics. The .access suffix keeps these
# files outside the existing /etc/logrotate.d/angie wildcard for *.log.
/var/log/angie/scissors-api-analytics.access /var/log/angie/scissors-beacon.access {
    daily
    missingok
    rotate 90
    maxage 90
    compress
    delaycompress
    notifempty
    create 0640 angie adm
    sharedscripts
    postrotate
        if [ -f /run/angie.pid ]; then
            kill -USR1 $(cat /run/angie.pid)
        fi
    endscript
}

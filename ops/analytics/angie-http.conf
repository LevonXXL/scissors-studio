# Include these definitions inside Angie http {} before the two scissors server blocks.
# The API collection log contains no IP, User-Agent, query string or request body.
map $uri $scissors_analytics_api {
    default 0;
    ~^/api/ 1;
}
log_format scissors_analytics_api '- - - [$time_local] "$request_method $uri $server_protocol" '
    '$status 0 "-" "-"';

# Beacon requests alone need IP + User-Agent in a short-lived Angie source log
# to calculate same-day visitors/sessions. No Django/database field receives them.
log_format scissors_analytics_beacon '$remote_addr - - [$time_local] '
    '"$request_method $uri $server_protocol" $status 0 "-" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=scissors_beacon:10m rate=30r/m;
